<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Position reconciliation architecture: broker feed flows into the ingestion queue, the reconciler service writes to MySQL via bulk INSERT ... ON DUPLICATE KEY UPDATE for idempotency, emits metrics, and exposes status to the ops dashboard.">
  <title>Position reconciliation — architecture</title>
  <desc>End of day broker statements arrive into a Redis-backed ingestion queue. A Flask reconciler service consumes them, batches 5,000 fills per transaction, writes to MySQL with a composite idempotency key (broker_id, fill_id, sequence) so retries short-circuit instead of double-writing positions. The service emits per-batch metrics and the ops dashboard subscribes to status updates.</desc>

  <defs>
    <style>
      .surface { fill: #0a0a0a; }
      .panel   { fill: #141416; }
      .stroke  { stroke: #2a2a2d; stroke-width: 1; }
      .strokeFaint { stroke: #1f1f22; stroke-width: 1; }
      .accent  { stroke: #3d52fe; stroke-width: 1.5; fill: none; }
      .accentFill { fill: #3d52fe; }
      .label   { fill: #e6e6e8; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; font-size: 13px; }
      .sub     { fill: #9a9aa2; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; font-size: 11px; letter-spacing: 0.04em; }
      .eyebrow { fill: #6c6c74; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
      .head    { fill: #ffffff; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; font-weight: 600; }
    </style>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d52fe"/>
    </marker>
    <marker id="arrowD" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d52fe"/>
    </marker>
  </defs>

  <rect class="surface" width="1200" height="520"/>

  <!-- title row -->
  <text x="32" y="38" class="eyebrow">POSITION-RECON · ARCHITECTURE</text>
  <text x="32" y="62" class="head">Idempotent end-of-day reconciliation, batched writes, observable failure modes.</text>

  <!-- LEFT column: broker feed -->
  <g transform="translate(32,120)">
    <rect class="panel stroke" width="200" height="100" rx="10"/>
    <text x="16" y="28" class="sub">EXTERNAL</text>
    <text x="16" y="52" class="head">Broker feed</text>
    <text x="16" y="72" class="label">end-of-day statements</text>
    <text x="16" y="88" class="label" style="fill:#9a9aa2">FIX · CSV · webhook</text>
  </g>

  <!-- arrow 1 -->
  <line class="accent" x1="232" y1="170" x2="304" y2="170" marker-end="url(#arrowR)"/>

  <!-- ingestion queue -->
  <g transform="translate(304,120)">
    <rect class="panel stroke" width="200" height="100" rx="10"/>
    <text x="16" y="28" class="sub">REDIS</text>
    <text x="16" y="52" class="head">Ingestion queue</text>
    <text x="16" y="72" class="label">durable, FIFO</text>
    <text x="16" y="88" class="label" style="fill:#9a9aa2">at-least-once delivery</text>
  </g>

  <!-- arrow 2 -->
  <line class="accent" x1="504" y1="170" x2="576" y2="170" marker-end="url(#arrowR)"/>

  <!-- reconciler service -->
  <g transform="translate(576,90)">
    <rect class="panel stroke" width="280" height="160" rx="10"/>
    <text x="16" y="28" class="sub">FLASK · PYTHON</text>
    <text x="16" y="52" class="head">Reconciler service</text>
    <text x="16" y="76" class="label">5k fills / transaction</text>
    <text x="16" y="94" class="label">executemany() bulk write</text>
    <text x="16" y="120" class="sub" style="fill:#3d52fe">IDEMPOTENCY KEY</text>
    <text x="16" y="138" class="label">(broker_id, fill_id, sequence)</text>
  </g>

  <!-- arrow 3 to MySQL -->
  <line class="accent" x1="856" y1="170" x2="928" y2="170" marker-end="url(#arrowR)"/>

  <!-- MySQL -->
  <g transform="translate(928,120)">
    <rect class="panel stroke" width="240" height="100" rx="10"/>
    <text x="16" y="28" class="sub">MYSQL</text>
    <text x="16" y="52" class="head">positions table</text>
    <text x="16" y="72" class="label">INSERT ... ON DUPLICATE</text>
    <text x="16" y="88" class="label">KEY UPDATE</text>
  </g>

  <!-- downward arrows -->
  <line class="accent" x1="716" y1="250" x2="716" y2="320" marker-end="url(#arrowD)"/>

  <!-- metrics + ops dashboard row -->
  <g transform="translate(440,340)">
    <rect class="panel stroke" width="240" height="90" rx="10"/>
    <text x="16" y="28" class="sub">PROMETHEUS</text>
    <text x="16" y="52" class="head">Metrics emitter</text>
    <text x="16" y="74" class="label">latency · throughput · retries</text>
  </g>

  <line class="accent" x1="680" y1="385" x2="752" y2="385" marker-end="url(#arrowR)"/>

  <g transform="translate(752,340)">
    <rect class="panel stroke" width="240" height="90" rx="10"/>
    <text x="16" y="28" class="sub">INTERNAL</text>
    <text x="16" y="52" class="head">Ops dashboard</text>
    <text x="16" y="74" class="label">batch status · alerts</text>
  </g>

  <!-- footer note -->
  <g transform="translate(32,460)">
    <rect class="panel strokeFaint" width="1136" height="40" rx="8"/>
    <circle cx="20" cy="20" r="3" class="accentFill"/>
    <text x="36" y="25" class="label" style="fill:#9a9aa2">retry-safe by construction · duplicate fills since deploy: 0 · p99 service latency &lt; 50ms</text>
  </g>
</svg>
